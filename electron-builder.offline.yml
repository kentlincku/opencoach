appId: com.kentlin.voicepractice
productName: Voice Practice
asar: true
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - apps/desktop/**
  - apps/web/**
  - resources/**
extraResources:
  - from: resources
    to: manifests
    filter:
      - "*.json"
  - from: dist/artifacts
    to: offline-artifacts
    filter:
      - "voice-runtime-windows-x64.zip"
      - "whisper-base-en.zip"
      - "kokoro-v1.0-onnx.zip"
      - "artifacts-manifest.json"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  createStartMenuShortcut: true
  artifactName: Voice-Practice-Full-Offline-Engineering-Setup-${version}-${arch}.${ext}
portable:
  artifactName: Voice-Practice-Full-Offline-Engineering-Portable-${version}-${arch}.${ext}
artifactName: Voice-Practice-Full-Offline-Engineering-${version}-${arch}.${ext}
