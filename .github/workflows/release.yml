name: Release (unsigned engineering pre-release)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.2.0-beta.1)'
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: npm ci
      - run: npm run build:icons
      - run: npm test
      - name: Build macOS embedded runtime (no model weights)
        run: bash scripts/build-macos-runtime.sh
      - name: Build unsigned DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:mac
      - name: Validate runtime inside packaged app
        run: node scripts/check-macos-runtime.mjs --app "dist/mac-arm64/Voice Practice.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: npm ci
      - run: npm run build:icons
      - run: npm test
      - name: Build and verify Setup and Portable EXE
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-and-verify-windows-package.ps1 -ExpectedCodeSha $sha
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: |
            dist/Voice-Practice-Setup-*.exe
            dist/Voice-Practice-Portable-*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - run: node scripts/write-checksums.mjs release
      - run: ls -la release && cat release/SHA256SUMS.txt
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          cat > notes.md <<EOF
          **Unsigned engineering pre-release — not for production.** Built by GitHub Actions from \`${sha}\`.

          - macOS: Apple Silicon (arm64) only, not signed or notarized. Gatekeeper will block the first launch.
          - Windows: x64, not Authenticode-signed. SmartScreen may warn.
          - No speech model weights are included and no model download manifest is published yet, so the app uses system/browser speech fallbacks.
          - Verify downloads against \`SHA256SUMS.txt\` before opening.

          Installation: see docs/install-macos.md and docs/install-windows.md.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --prerelease \
            --title "OpenCoach $RELEASE_TAG (unsigned engineering pre-release)" \
            --notes-file notes.md
