name: Release (unsigned engineering pre-release)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.2.0-beta.1)'
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.7
      - run: npm ci
      - run: npm run build:icons
      - run: python -m pip install -r requirements-test.txt
      - run: npm test
        env:
          PYTHON: python
      - name: Build runtime from pinned sources, stage, pack, ad-hoc seal (no model weights)
        run: bash scripts/ci-pack-macos.sh "$RUNNER_TEMP/opencoach-mac"
      - name: Collect release files
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP"/opencoach-mac/release/*.dmg "$RUNNER_TEMP"/opencoach-mac/release/*.zip dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 26}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - run: node scripts/write-checksums.mjs release
      - run: ls -la release && cat release/SHA256SUMS.txt
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          cat > notes.md <<EOF
          **Unsigned engineering pre-release — not for production.** Built by GitHub Actions from \`${sha}\`.

          - macOS only in this release: Apple Silicon (arm64), ad-hoc signed (no Developer ID), not notarized. The first launch is blocked; open it from System Settings → Privacy & Security → Open Anyway.
          - Speech models are not included. Choose and download them in Settings (Hugging Face / GitHub sources pinned to exact revisions, verified by SHA-256).
          - Windows stays on v0.2.0-beta.1; iOS is source-only (build it yourself with Xcode, see docs/install-ios.md).
          - Verify downloads against \`SHA256SUMS.txt\` before opening.

          Installation: see docs/install-macos.md and docs/install-ios.md.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --prerelease \
            --title "OpenCoach $RELEASE_TAG (unsigned engineering pre-release)" \
            --notes-file notes.md
