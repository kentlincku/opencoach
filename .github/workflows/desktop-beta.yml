name: Desktop Beta and verification
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'resources/**'
      - 'spikes/packaged-runtime/**'
      - 'patches/**'
      - 'scripts/ci-*'
      - 'scripts/macos-*'
      - 'scripts/r56-build-local-runtime.py'
      - '.github/workflows/desktop-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-arm64-verify:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.7
      - run: npm ci
      - run: npm run build:icons
      - run: python -m pip install -r requirements-test.txt
      - run: npm test
        env:
          PYTHON: python
      - name: Build runtime from pinned sources, stage, pack, ad-hoc seal (no model weights)
        run: bash scripts/ci-pack-macos.sh "$RUNNER_TEMP/opencoach-mac"
      - name: Sealed App verifies and its runtime starts
        run: |
          app="$RUNNER_TEMP/opencoach-mac/pack/artifacts/mac-arm64/Voice Practice.app"
          codesign --verify --deep --strict "$app"
          mkdir -p "$RUNNER_TEMP/rt"
          VOICE_RUNTIME_TEMP_DIR="$RUNNER_TEMP/rt" "$app/Contents/Resources/voice-assets/runtime/bin/voice-runtime" --help | grep -F '"event":"ready"'
