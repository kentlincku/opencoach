name: Windows verification
# v0.3.0-beta.1 ships macOS only. Windows packaging moved to the model-pack pipeline
# (scripts/win-*), which has not been verified on hosted runners yet; this job keeps the
# test suite and syntax checks green on Windows until the Windows release is reworked.
on:
  pull_request:
    paths:
      - '.github/workflows/windows-beta.yml'
      - 'tests/**'
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 26, cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: npm ci
      - run: npm run build:icons
      - run: python -m pip install -r requirements-test.txt
      - run: npm test
        env:
          PYTHON: python
      - name: Check Node syntax
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path apps/desktop -Filter *.cjs -File
            Get-ChildItem -Path scripts -Filter *.mjs -File
          )
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Node syntax check failed: $($file.FullName)"
            }
          }
