name: Android source verification

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-beta.yml"
      - "apps/web/**"
      - "contracts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Static Android security contract
        run: python3 apps/android/tests/verify_android_contract.py
      - name: Unit, lint, debug APK, and instrumentation-test APK
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Confirm local build products exist without publishing them
        run: |
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          test -s apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
