appId: com.kentlin.voicepractice
productName: Voice Practice
asar: true
# Ship only the English and Traditional Chinese Electron/Chromium locales (220 otherwise, ~70 MB).
electronLanguages:
  - en
  - zh_TW
beforePack: scripts/build-foundation-models.cjs
afterPack: scripts/verify-foundation-models-bundle.cjs
afterSign: scripts/verify-foundation-models-bundle.cjs
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - apps/desktop/**
  - apps/web/**
  - node_modules/pend/**
  - node_modules/yauzl/**
extraResources:
  - from: resources
    to: manifests
    filter:
      - "*.json"
mac:
  extraResources:
    - from: build/r22-provenance/build-source.json
      to: build-source.json
    - from: build/foundation-models/arm64
      to: foundation-models
      filter:
        - voice-foundation-models
        - manifest.json
  binaries:
    - Contents/Resources/foundation-models/voice-foundation-models
  category: public.app-category.education
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extendInfo:
    NSMicrophoneUsageDescription: Voice Practice uses the microphone only when you choose to record speech.
    NSSpeechRecognitionUsageDescription: Voice Practice transcribes speech only when you choose to record.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  createStartMenuShortcut: true
  artifactName: Voice-Practice-Setup-${version}-${arch}.${ext}
portable:
  artifactName: Voice-Practice-Portable-${version}-${arch}.${ext}
artifactName: Voice-Practice-${version}-${arch}.${ext}
